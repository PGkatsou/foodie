<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>Tablepop | Make a meal of it</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,500,40,1;9..144,600,40,1;9..144,700,40,1&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7f4;
      --ink: #252b27;
      --green: #e3eedb;
      --tomato: #e96f46;
      --blue: #287c70;
      --pink: #f4d7c8;
      --yellow: #f3d577;
      --brand-teal: #087f75;
      --brand-coral: #f26845;
      --brand-blue: #3158d8;
      --brand-leaf: #67a849;
      --line: #e4e9e3;
      --serif: "Fraunces", Georgia, serif;
      --sans: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { position: relative; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .background-art { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    #app-content { position: relative; z-index: 1; }
    .produce-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
    .produce-mark { position: absolute; width: 100px; height: 100px; opacity: .4; }
    .produce-mark--01 { top: 2%; left: 5%; transform: rotate(-14deg); }
    .produce-mark--02 { top: 3%; left: 34%; transform: rotate(9deg); }
    .produce-mark--03 { top: 1%; left: 65%; transform: rotate(-18deg); }
    .produce-mark--04 { top: 4%; right: 4%; transform: rotate(12deg); }
    .produce-mark--05 { top: 19%; left: 2%; transform: rotate(13deg); }
    .produce-mark--06 { top: 20%; left: 31%; transform: rotate(-8deg); }
    .produce-mark--07 { top: 18%; left: 62%; transform: rotate(17deg); }
    .produce-mark--08 { top: 21%; right: 2%; transform: rotate(-11deg); }
    .produce-mark--09 { top: 38%; left: 5%; transform: rotate(-10deg); }
    .produce-mark--10 { top: 39%; left: 35%; transform: rotate(12deg); }
    .produce-mark--11 { top: 37%; left: 66%; transform: rotate(-16deg); }
    .produce-mark--12 { top: 40%; right: 4%; transform: rotate(9deg); }
    .produce-mark--13 { top: 57%; left: 2%; transform: rotate(11deg); }
    .produce-mark--14 { top: 58%; left: 32%; transform: rotate(-13deg); }
    .produce-mark--15 { top: 56%; left: 63%; transform: rotate(8deg); }
    .produce-mark--16 { top: 59%; right: 2%; transform: rotate(-17deg); }
    .produce-mark--17 { top: 76%; left: 5%; transform: rotate(-12deg); }
    .produce-mark--18 { top: 77%; left: 35%; transform: rotate(15deg); }
    .produce-mark--19 { top: 75%; left: 66%; transform: rotate(-9deg); }
    .produce-mark--20 { top: 78%; right: 4%; transform: rotate(13deg); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .topbar { height: 68px; padding: 0 4vw; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 46px; height: 46px; flex: 0 0 auto; overflow: visible; }
    .brand-name { font-family: var(--serif); font-size: 27px; font-weight: 700; line-height: 1; }
    .brand-name span:last-child { color: var(--brand-coral); }
    .splash { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--brand-coral); color: #fffaf1; opacity: 1; transition: opacity .25s ease; }
    .splash.is-leaving { opacity: 0; pointer-events: none; }
    .splash-content { display: grid; justify-items: center; gap: 16px; padding: 24px; text-align: center; }
    .splash-mark { width: 118px; height: auto; overflow: visible; animation: splash-pop .65s cubic-bezier(.2, .8, .2, 1) both; }
    .splash-name { margin: 0; font-family: var(--serif); font-size: 58px; font-weight: 700; line-height: 1; animation: splash-rise .55s .1s both; }
    .splash-name span:last-child { color: var(--yellow); }
    .splash-tagline { margin: 0; font-size: 13px; font-weight: 700; }
    .top-note { display: flex; align-items: center; gap: 9px; color: #667068; font-size: 11px; font-weight: 600; }
    main { max-width: 1600px; margin: auto; padding: 29px 4vw 60px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; justify-items: center; gap: 24px; margin-bottom: 24px; text-align: center; }
    .eyebrow { margin: 0 0 6px; color: #b95d3d; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; max-width: none; font-family: var(--sans); font-size: 29px; font-weight: 700; line-height: 1.15; letter-spacing: 0; white-space: nowrap; }
    h1 em { color: var(--tomato); font-style: normal; font-weight: 700; }
    .workspace { display: grid; grid-template-columns: 285px minmax(0, 1fr); align-items: start; gap: 22px; }
    .planner { position: sticky; top: 18px; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 3px 12px rgba(32, 45, 37, .035); }
    .planner-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 13px; border-bottom: 1px solid var(--line); }
    .planner-head h2 { margin: 0; font-family: var(--sans); font-size: 15px; font-weight: 700; }
    .step-count { font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .planner-fields { display: grid; gap: 15px; padding: 16px; }
    .field label, .field-label { display: block; margin-bottom: 7px; font-size: 10px; font-weight: 700; }
    .field input, .field select { width: 100%; height: 39px; padding: 0 10px; background: #fbfcfa; border: 1px solid #dfe5df; border-radius: 5px; color: var(--ink); outline-color: var(--tomato); }
    .occasion-error { margin: 7px 0 0; color: #a42c1e; font-size: 11px; font-weight: 700; line-height: 1.4; }
    .money-input { position: relative; }
    .money-input span { position: absolute; top: 10px; left: 11px; z-index: 1; color: #717a73; font-weight: 700; }
    .money-input input { padding-left: 29px; }
    .people-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
    .people-row input { width: 105px; text-align: center; font-weight: 700; }
    .people-controls { display: flex; gap: 6px; }
    .stepper { width: 32px; height: 32px; display: grid; place-items: center; background: #fff; border: 1px solid #dfe5df; border-radius: 6px; cursor: pointer; font-size: 17px; }
    .course-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .course-option { min-height: 34px; background: #fff; border: 1px solid #dfe5df; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 700; }
    .course-option[aria-pressed="true"] { background: #fff0e8; border-color: #efb49d; color: #b95331; }
    .submit-button { width: 100%; min-height: 43px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; background: var(--tomato); border: 0; border-radius: 5px; color: white; cursor: pointer; font-size: 11px; font-weight: 700; }
    .submit-button:hover { background: #d95f3a; }
    .submit-button span:last-child { font-size: 20px; }
    .planner-foot { padding: 10px 16px 12px; border-top: 1px solid var(--line); color: #707971; font-size: 9px; font-weight: 500; }
    .results { min-width: 0; }
    .results-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 2px 0 17px; }
    .results-heading h2 { margin: 0; font-family: var(--sans); font-size: 19px; font-weight: 700; line-height: 1.2; }
    .results-heading p { margin: 5px 0 0; color: #778079; font-size: 10px; }
    .match-count { flex: 0 0 auto; padding: 7px 10px; background: #fff0e8; border: 0; border-radius: 16px; color: #b95331; font-size: 9px; font-weight: 700; text-transform: none; }
    .menu-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 12px; }
    .menu-card { display: flex; min-width: 0; flex-direction: column; min-height: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
    .menu-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(32, 45, 37, .09); }
    .menu-photo { position: relative; height: 148px; min-height: 0; background: #e8ece7; }
    .menu-photo img { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; }
    .menu-number { position: absolute; left: 9px; top: 9px; width: 27px; height: 27px; display: grid; place-items: center; background: #fff; border: 0; border-radius: 7px; color: #414943; font-family: var(--sans); font-size: 10px; font-weight: 700; }
    .menu-info { min-width: 0; display: flex; flex: 1; flex-direction: column; padding: 12px; }
    .menu-kicker { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #9e674a; font-size: 8px; font-weight: 700; text-transform: none; }
    .menu-kicker .fit { color: #538052; }
    .menu-info h3 { margin: 6px 0 3px; font-family: var(--sans); font-size: 14px; font-weight: 700; line-height: 1.3; }
    .dish-list { display: flex; flex-wrap: wrap; gap: 4px 9px; margin-top: 5px; color: #69726b; font-size: 9px; line-height: 1.5; }
    .dish-list span::before { content: "+"; margin-right: 4px; color: var(--tomato); font-weight: 800; }
    .dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .dish-choice { min-width: 0; padding: 0; overflow: hidden; background: #fffdf8; border: 1px solid var(--ink); border-radius: 3px; cursor: pointer; text-align: left; transition: transform .18s ease, box-shadow .18s ease; }
    .dish-choice:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
    .dish-choice:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .dish-choice img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #e8dfce; }
    .dish-choice span { display: block; padding: 11px 12px 13px; font-family: var(--serif); font-size: 18px; font-weight: 600; line-height: 1.2; }
    .menu-bottom { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 11px; }
    .price { font-family: var(--sans); font-size: 15px; font-weight: 700; line-height: 1.2; }
    .price small { display: block; margin-top: 3px; color: #828b84; font-size: 8px; font-weight: 500; line-height: 1.3; }
    .detail-button { min-height: 32px; padding: 0 9px; background: var(--blue); border: 0; border-radius: 5px; color: white; cursor: pointer; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .detail-button:hover { background: #20685f; }
    .empty-state { padding: 38px 26px; background: var(--yellow); border: 1px solid var(--ink); text-align: center; }
    .empty-state .empty-mark { font-size: 38px; }
    .empty-state h3 { margin: 8px 0; font-family: var(--serif); font-size: 29px; }
    .empty-state p { margin: 0; font-size: 12px; line-height: 1.5; }
    .detail-view { display: none; }
    .detail-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 1px 0 15px; }
    .back-button { padding: 8px 0; background: none; border: 0; cursor: pointer; font-size: 11px; font-weight: 800; }
    .back-button span { margin-right: 6px; font-size: 16px; }
    .detail-title { margin: 0; font-family: var(--serif); font-size: 34px; font-weight: 600; }
    .detail-summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
    .summary-chip { padding: 7px 10px; background: var(--yellow); border: 1px solid var(--ink); border-radius: 2px; font-size: 10px; font-weight: 800; }
    .export-list-button { min-height: 38px; padding: 0 13px; background: var(--blue); border: 0; border-radius: 5px; color: #fff; cursor: pointer; font-size: 11px; font-weight: 700; }
    .recipe-grocery-tools { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line); }
    .recipe-grocery-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px; }
    .recipe-grocery-heading h5 { margin: 0; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .shopping-list-count { color: #707971; font-size: 10px; font-weight: 700; }
    .shopping-list-items { margin: 6px 0 12px; padding: 0; list-style: none; }
    .shopping-list-items li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
    .shopping-list-items li span:last-child { flex: 0 0 auto; color: #62675f; font-weight: 700; }
    .shopping-list-empty { color: #707971; font-size: 11px !important; }
    .save-list-choice { display: flex; align-items: flex-start; gap: 9px; margin-top: 12px; font-size: 12px; font-weight: 700; line-height: 1.4; cursor: pointer; }
    .save-list-choice input { width: 18px; height: 18px; flex: 0 0 auto; margin: 0; accent-color: var(--brand-teal); }
    .save-list-choice input:disabled { cursor: not-allowed; }
    .saved-list-status { min-height: 16px; margin: 6px 0 0 27px; color: #538052; font-size: 10px; }
    .export-list-button { width: 100%; margin-top: 4px; background: var(--tomato); }
    .export-list-button:disabled { background: #aeb7af; cursor: not-allowed; }
    .recipe-list { display: grid; gap: 13px; }
    .recipe { overflow: hidden; background: #fffdf8; border: 1px solid var(--ink); border-radius: 3px; }
    .recipe-head { display: grid; grid-template-columns: 130px 1fr; min-height: 112px; border-bottom: 1px solid var(--line); }
    .recipe-head img { width: 100%; height: 100%; min-height: 112px; object-fit: cover; }
    .recipe-title { align-self: center; padding: 13px 17px; }
    .recipe-title .course-label { color: var(--tomato); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .recipe-title h3 { margin: 4px 0; font-family: var(--serif); font-size: 22px; font-weight: 600; }
    .recipe-title p { margin: 0; color: #5c6058; font-size: 10px; }
    .recipe-content { display: grid; grid-template-columns: minmax(145px, .75fr) 1.25fr; gap: 20px; padding: 15px 17px 17px; }
    .recipe-content h4 { margin: 0 0 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .ingredients { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .ingredients li { padding-bottom: 7px; border-bottom: 1px dashed var(--line); font-size: 13px; line-height: 1.4; }
    .recipe-ingredient { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: baseline; gap: 9px; cursor: pointer; }
    .recipe-ingredient input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--brand-teal); }
    .recipe-ingredient input:checked + span { color: #788078; }
    .ingredients li span:last-child { flex: 0 0 auto; color: #62675f; font-weight: 700; }
    .method { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
    .method li { position: relative; padding-left: 30px; color: #41463f; font-size: 14px; line-height: 1.6; counter-increment: step; }
    .method li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 21px; height: 21px; display: grid; place-items: center; background: var(--green); border: 1px solid var(--ink); border-radius: 50%; color: var(--ink); font-size: 11px; font-weight: 800; }
    @keyframes splash-pop { from { opacity: 0; transform: scale(.72) rotate(-12deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 900px) {
      main { padding-right: 4vw; padding-left: 4vw; }
      .topbar { padding-right: 4vw; padding-left: 4vw; }
      .intro { grid-template-columns: minmax(0, 1fr); }
      .workspace { grid-template-columns: 260px minmax(0, 1fr); gap: 18px; }
      .menu-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .menu-photo { height: 138px; }
    }
    @media (max-width: 680px) {
      .produce-mark { width: 68px; height: 68px; opacity: .34; }
      .produce-mark--03, .produce-mark--04, .produce-mark--07, .produce-mark--08, .produce-mark--11, .produce-mark--12, .produce-mark--15, .produce-mark--16, .produce-mark--19, .produce-mark--20 { display: none; }
      .produce-mark--01, .produce-mark--09, .produce-mark--17 { left: 3%; }
      .produce-mark--02, .produce-mark--10, .produce-mark--18 { left: 76%; }
      .produce-mark--05, .produce-mark--13 { left: 3%; }
      .produce-mark--06, .produce-mark--14 { left: 76%; }
      .topbar { height: 74px; }
      .brand { gap: 7px; }
      .brand-mark { width: 50px; height: 50px; }
      .brand-name { font-size: 29px; }
      .top-note { font-size: 10px; }
      main { padding-top: 29px; }
      .intro { grid-template-columns: minmax(0, 1fr); gap: 17px; margin-bottom: 24px; }
      h1 { font-size: 24px; }
      .workspace { grid-template-columns: 1fr; gap: 27px; }
      .planner { position: static; }
      .planner-fields { grid-template-columns: 1fr 1fr; gap: 15px; }
      .field-courses, .submit-button { grid-column: 1 / -1; }
      .planner-foot { padding-top: 9px; }
      .results-heading h2 { font-size: 28px; }
      .menu-list { grid-template-columns: 1fr; }
      .menu-card { min-height: 0; }
      .menu-photo { height: 185px; }
      .menu-info { padding: 12px; }
      .menu-info h3 { font-size: 15px; }
      .dish-list { gap: 4px 7px; font-size: 9px; }
      .price { font-size: 16px; }
      .detail-button { padding: 0 8px; }
      .recipe-content { grid-template-columns: 1fr; gap: 17px; }
      .recipe-head { grid-template-columns: 98px 1fr; }
      .detail-title { font-size: 29px; }
    }
    @media (max-width: 390px) {
      .top-note { display: none; }
      .brand-mark { width: 48px; height: 48px; }
      .brand-name { font-size: 28px; }
      .menu-info { padding: 11px; }
      .menu-kicker { font-size: 8px; }
      .price small { font-size: 9px; }
      .course-option { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash-screen" role="status" aria-label="Welcome to Tablepop">
    <div class="splash-content">
      <svg class="splash-mark" viewBox="0 0 72 64" aria-hidden="true">
        <path d="M8 8l2.2 5.8L16 16l-5.8 2.2L8 24l-2.2-5.8L0 16l5.8-2.2L8 8Z" fill="#f26845" />
        <path d="M61 5l1.6 4.4L67 11l-4.4 1.6L61 17l-1.6-4.4L55 11l4.4-1.6L61 5Z" fill="#3158d8" />

        <circle cx="35" cy="36" r="20" fill="#fffaf1" stroke="#087f75" stroke-width="3" />

        <circle cx="45" cy="26" r="3" fill="#f26845" stroke="#20251f" stroke-width="1" />
        <circle cx="23" cy="45" r="2" fill="#3158d8" />
      </svg>
      <p class="splash-name"><span>table</span><span>pop</span></p>
      <p class="splash-tagline">Good food, good company</p>
    </div>
  </div>
  <div class="background-art" aria-hidden="true">
    <svg class="produce-definitions" aria-hidden="true">
      <symbol id="produce-lemon" viewBox="0 0 120 100"><path d="M10 51c12-23 29-36 50-36s38 13 50 36c-12 23-29 36-50 36S22 74 10 51Z" fill="#f3d577" stroke="#b95d3d" stroke-width="3"/><path d="M60 16c-7-10-18-12-25-7 5 9 14 12 25 7Zm2 0c6-11 17-14 25-8-5 9-14 12-25 8Z" fill="#67a849" stroke="#287c70" stroke-width="2"/><path d="M31 49c7-8 13-11 19-12" fill="none" stroke="#fffaf1" stroke-width="4" stroke-linecap="round"/></symbol>

        ingredients: [[4, "slices", "sourdough"], [250, "g", "ripe tomatoes"], [150, "g", "ricotta"], [1, "tbsp", "olive oil"], [8, "leaves", "fresh basil"]],
        method: ["Toast the sourdough in a toaster or under a medium grill for 2–3 minutes per side, until crisp at the edges. Let it cool for 1 minute so the ricotta does not melt.", "Rinse and dry the tomatoes, cut them into 1 cm pieces, then toss with olive oil, a pinch of salt and black pepper. Leave for 5 minutes so they release their juices.", "Spread ricotta evenly over each toast. Spoon the tomatoes on top, leaving excess juice in the bowl, then finish with torn basil and serve immediately."]
      },
      carrotSoup: {
        name: "Carrot & ginger soup", course: "A little something", cost: 2.9,

        ingredients: [[600, "g", "carrots"], [1, "", "onion"], [2, "cm", "fresh ginger"], [750, "ml", "vegetable stock"], [100, "ml", "coconut milk"]],
        method: ["Peel the carrots and cut into 2 cm pieces. Dice the onion finely and grate the ginger so it cooks evenly.", "Warm 1 tablespoon of oil in a large pot over medium heat. Add the onion and cook for 5 minutes, stirring, until soft but not browned. Stir in the ginger for 30 seconds.", "Add carrots and stock; the liquid should nearly cover the vegetables. Bring to a boil, then reduce to a gentle simmer, cover and cook 20–25 minutes, until a knife slides easily into a carrot.", "Turn off the heat. Blend until completely smooth, working in batches and venting the blender lid for hot steam. Stir in coconut milk, rewarm gently and season with salt and pepper."]

      lemonChicken: {
        name: "Lemon roast chicken", course: "The main event", cost: 7.8,
        image: "photo-1555939594-58d7cb561ad1",

        method: ["Heat the oven to 200°C conventional (180°C fan). Pat the chicken dry with paper towel and arrange skin-side up in a single layer in a roasting dish.", "Mix olive oil with finely grated lemon zest, crushed garlic, chopped rosemary, ½ teaspoon salt and black pepper. Rub over the chicken; cut the lemon into wedges and tuck them between the thighs.", "Roast uncovered for 35–45 minutes, depending on thigh size. Start checking at 35 minutes: the skin should be golden and a thermometer in the thickest part, away from bone, must read 74°C.", "Rest the chicken in the dish for 5 minutes so the juices settle. Spoon the pan juices over the top and serve hot."]

      mushroomPasta: {
        name: "Creamy wild mushroom pasta", course: "The main event", cost: 6.4,
        image: "photo-1476224203421-9ac39bcb3327",
        ingredients: [[350, "g", "tagliatelle"], [300, "g", "mixed mushrooms"], [150, "ml", "single cream"], [40, "g", "parmesan"], [2, "cloves", "garlic"]],
        method: ["Bring a large pot of water to a rolling boil, salt it well, and cook the tagliatelle according to the packet time, stopping 1 minute before done. Before draining, reserve at least 250 ml of pasta water.", "While the pasta cooks, slice the mushrooms. Heat a wide pan over medium-high heat, add a little oil, and cook mushrooms in a single layer in batches if needed. Leave them undisturbed for 2 minutes, then stir and cook until browned and their liquid has evaporated, about 6–8 minutes total.", "Lower the heat to medium. Add finely chopped garlic and cook for 30 seconds, then pour in the cream and simmer gently for 2 minutes. Stir in finely grated parmesan until melted; do not let the sauce boil hard.", "Add drained pasta and toss for 1 minute. Add reserved pasta water 1 tablespoon at a time until the sauce clings to the noodles. Taste, season with salt and pepper, and serve immediately."]
      },
      roastSquash: {
        name: "Roast squash & crispy chickpeas", course: "The main event", cost: 5.2,
        image: "photo-1490645935967-10de6ba17061",
        ingredients: [[1, "kg", "butternut squash"], [400, "g", "chickpeas"], [2, "tbsp", "olive oil"], [1, "tsp", "smoked paprika"], [150, "g", "Greek yoghurt"]],
        method: ["Heat the oven to 210°C conventional (190°C fan). Line a large baking tray with parchment. Peel the squash, scoop out the seeds and cut into 2 cm wedges. Drain and thoroughly dry the chickpeas.", "Toss squash and chickpeas with olive oil, smoked paprika, ½ teaspoon salt and black pepper. Spread in one layer with space between pieces; use two trays if crowded.", "Roast for 30–35 minutes, turning the squash and shaking the chickpeas halfway through. The squash is ready when a fork pierces it easily; chickpeas should be dry and crisp at the edges.", "Season while hot. Spread the yoghurt on a serving plate, pile the squash on top and scatter over the chickpeas. Serve before the chickpeas soften."]
      },
      greenSalad: {
        name: "Herby green salad", course: "Something on the side", cost: 2.1,
        image: "photo-1512621776951-a57141f2eefd",
        ingredients: [[150, "g", "mixed leaves"], [1, "", "cucumber"], [1, "bunch", "fresh herbs"], [1, "tbsp", "lemon juice"], [2, "tbsp", "olive oil"]],
        method: ["Wash the leaves and dry them completely in a salad spinner or clean towel; wet leaves dilute the dressing. Peel the cucumber into ribbons, stopping when you reach the watery seed core.", "Finely chop the herbs. In a small bowl, whisk lemon juice with olive oil, a pinch of salt and black pepper until lightly emulsified.", "Place leaves and cucumber in a large bowl. Pour over half the dressing and toss gently with clean hands; add more dressing only until lightly coated.", "Taste one leaf and adjust salt, pepper or lemon. Scatter herbs over the top and serve straight away so the leaves stay crisp."]
      },
      potatoes: {
        name: "Crispy rosemary potatoes", course: "Something on the side", cost: 2.4,

        method: ["Heat the oven to 210°C conventional (190°C fan). Halve potatoes larger than 4 cm so all pieces cook at the same rate. Rinse off surface starch, then dry very thoroughly.", "Toss potatoes with olive oil, finely chopped rosemary, crushed garlic, ½ teaspoon salt and black pepper. Arrange cut-side down on a preheated tray with space between pieces.", "Roast for 20 minutes without moving them. Turn the potatoes and roast another 15–20 minutes, until deeply golden and a knife slides through the centre easily.", "Taste one and add a pinch more salt if needed. Serve immediately while the edges are crisp."]
      },
      oliveCake: {
        name: "Lemon olive oil cake", course: "A sweet finish", cost: 2.7,
        image: "photo-1488477181946-6428a0291777",
        ingredients: [[180, "g", "plain flour"], [150, "g", "caster sugar"], [2, "", "eggs"], [100, "ml", "olive oil"], [1, "", "lemon"]],
        method: ["Heat the oven to 180°C conventional (160°C fan). Line the base of a 20 cm round cake tin with baking paper and lightly oil the sides. Bring eggs to room temperature for an even rise.", "Whisk eggs and sugar for 3–4 minutes, until pale, thick and leaving a ribbon when the whisk is lifted. Slowly whisk in olive oil, then add finely grated lemon zest and 2 tablespoons lemon juice.", "Sift in flour with a pinch of salt. Fold gently with a spatula just until no dry flour remains; stop as soon as the batter is uniform to keep the cake tender.", "Pour into the tin and bake on the centre rack for 30–35 minutes. It is ready when golden and a skewer inserted in the centre comes out clean or with a few dry crumbs. Cool in the tin for 10 minutes, then turn onto a rack."]
      },
      berryCups: {
        name: "Summer berries & cream", course: "A sweet finish", cost: 3.2,
        image: "photo-1464305795204-6f5bbfc7fb81",
        ingredients: [[400, "g", "mixed berries"], [250, "ml", "double cream"], [2, "tbsp", "honey"], [4, "", "shortbread biscuits"]],
        method: ["Rinse the berries only if needed and dry them well. Set aside a handful for topping; gently crush the rest with honey using a fork, leaving some whole pieces for texture.", "Chill a bowl and whisk for 10 minutes if the room is warm. Whip cold cream to soft peaks: it should hold a gentle curve when the whisk is lifted. Stop before it looks grainy.", "Break the shortbread into bite-size pieces. Layer berries, cream and biscuit in four glasses, repeating once if the glasses are tall.", "Finish with the reserved berries and serve within 30 minutes so the shortbread keeps some crunch."]
      },
      chocolateMousse: {
        name: "Little chocolate pots", course: "A sweet finish", cost: 3.6,
        image: "photo-1563805042-7684c019e1cb",
        ingredients: [[150, "g", "dark chocolate"], [3, "", "eggs"], [150, "ml", "double cream"], [1, "tbsp", "caster sugar"]],
        method: ["Use pasteurized eggs for this no-bake dessert. Finely chop the chocolate and melt it in a heatproof bowl set over (not touching) gently simmering water. Stir until smooth, remove from heat and cool until just warm, about 10 minutes.", "Separate eggs carefully, keeping yolks out of the whites. Whisk yolks into the warm chocolate one at a time. In a separate cold bowl, whip cream to soft peaks and fold it into the chocolate in two additions.", "With clean, grease-free beaters, whisk egg whites until foamy. Add sugar gradually and whisk to glossy peaks that hold their shape. Fold one-third into the chocolate to loosen it, then gently fold in the rest without knocking out the air.", "Divide between clean cups, cover and refrigerate at 4°C or colder for at least 3 hours, until set. Keep chilled until serving."]
      },
      avocadoToast: {
        name: "Smashed avocado toast", course: "A brunch favourite", cost: 3.4,
        image: "photo-1525351484163-7529414344d8",
        ingredients: [[2, "", "ripe avocados"], [4, "slices", "sourdough"], [1, "", "lime"], [1, "tsp", "chilli flakes"], [4, "", "eggs"]],
        method: ["Toast sourdough until crisp and golden. Halve and pit the avocados, scoop the flesh into a bowl, and mash with lime juice, ¼ teaspoon salt and black pepper. Leave some small chunks for texture.", "Bring a saucepan of water to a bare simmer; small bubbles should rise but the water must not boil. Crack each egg into a cup, swirl the water gently, and slide in one egg at a time. Poach 3–4 minutes for a runny yolk or 5 minutes for a firmer yolk.", "Lift eggs out with a slotted spoon and briefly drain on a clean towel. Spread avocado on the toast, add one egg per slice, and finish with chilli flakes and a pinch of salt. Serve immediately."]
      },
      shakshuka: {
        name: "One-pan shakshuka", course: "The brunch centrepiece", cost: 4.1,
        image: "photo-1590412200988-a436970781fa",
        ingredients: [[1, "", "onion"], [1, "", "red pepper"], [400, "g", "chopped tomatoes"], [4, "", "eggs"], [1, "tsp", "ground cumin"]],
        method: ["Dice the onion and red pepper into 1 cm pieces. Heat 1 tablespoon olive oil in a wide lidded pan over medium heat. Cook vegetables for 7–8 minutes, stirring often, until soft but not browned.", "Stir in cumin and paprika for 30 seconds. Add chopped tomatoes, ½ teaspoon salt and black pepper. Bring to a gentle bubble, lower heat and simmer uncovered for 12–15 minutes, stirring occasionally, until thick enough that a spoon leaves a trail.", "Make four evenly spaced wells in the sauce. Crack one egg into each well, cover the pan and cook over low heat for 5–8 minutes. Check often: whites should be opaque and set while yolks remain soft, or cook longer if you prefer firm yolks.", "Remove from heat, season the eggs with a little salt and serve directly from the pan with warm bread."]
      },
      eggsBenedict: {
        name: "Poached eggs Benedict", course: "The brunch centrepiece", cost: 5.2,
        image: "photo-1525351484163-7529414344d8",
        ingredients: [[4, "", "eggs"], [2, "", "English muffins"], [4, "slices", "smoked ham"], [100, "g", "butter"], [2, "", "egg yolks"]],
        method: ["Split and toast the muffins until golden; place cut-side up on warm plates. Warm the ham in a pan for 30–60 seconds per side. Keep both warm while you prepare the eggs and sauce.", "For the hollandaise, melt butter and keep it warm, not sizzling. Whisk yolks with 1 teaspoon lemon juice in a heatproof bowl over barely simmering water; the bowl must not touch the water. Whisk constantly until pale and thick, then slowly drizzle in butter while whisking until glossy. If it gets too thick, whisk in 1 teaspoon warm water. Remove from heat and season.", "Bring a deep pan of water to a bare simmer. Crack each egg into a cup, slide it into the water and poach 3–4 minutes until the white is set but the yolk still wobbles. Lift out with a slotted spoon and drain briefly.", "Place ham on each muffin half, top with a poached egg and spoon hollandaise over it. Serve immediately; do not leave the sauce sitting over direct heat."]
      },
      smokedSalmonRosti: {
        name: "Smoked salmon & potato rösti", course: "The brunch centrepiece", cost: 5.8,

        ingredients: [[500, "g", "potatoes"], [150, "g", "smoked salmon"], [100, "g", "crème fraîche"], [1, "", "lemon"], [1, "bunch", "fresh dill"]],
        method: ["Peel the potatoes and coarsely grate them. Wrap the shreds in a clean tea towel and squeeze firmly over the sink until no more liquid drips out; this is key to crisp rösti. Season with ½ teaspoon salt and black pepper.", "Heat a thin layer of oil in a non-stick pan over medium heat. Add a handful of potato, press into a 1 cm-thick round, and cook 4–5 minutes without moving until the underside is deep golden. Flip carefully and cook 4–5 minutes more. Keep finished rösti warm on a rack in a low oven.", "Divide smoked salmon over the hot rösti. Add a spoonful of crème fraîche, chopped dill and a small squeeze of lemon. Serve while crisp."]
      },
      roastSalmon: {
        name: "Lemon butter roast salmon", course: "The main event", cost: 8.6,
        image: "photo-1519708227418-c8fd9a32b7a2",
        ingredients: [[700, "g", "salmon fillet"], [1, "", "lemon"], [50, "g", "butter"], [2, "tbsp", "fresh dill"], [500, "g", "new potatoes"]],
        method: ["Heat the oven to 200°C conventional (180°C fan). Put the new potatoes in a pot, cover with cold salted water, bring to a boil and simmer 15–20 minutes until a knife enters easily. Drain and cover to keep warm.", "Meanwhile, place salmon skin-side down in a lightly oiled roasting dish. Pat dry and check for pin bones; pull any out with tweezers. Season with salt and black pepper, then top with thin lemon slices and small pieces of butter.", "Roast on the centre rack for 12–18 minutes depending on thickness. Check the thickest part: it should turn opaque and separate into moist flakes, or reach 63°C on an instant-read thermometer. Rest for 2 minutes.", "Chop the dill and scatter over the salmon. Serve with the potatoes and pan juices."]
      },
      steakFrites: {

    const coursePlans = { 1: [1], 2: [0, 1], 3: [0, 1, 3], 4: [0, 1, 2, 3] };
    const occasionKeywords = {
      family: ["family", "relatives", "reunion"],
      date: ["date", "romantic", "anniversary", "valentine"],
      birthday: ["birthday", "celebration", "graduation", "promotion", "milestone"],
      friends: ["friend", "mates", "potluck", "get together", "game night", "party", "picnic", "barbecue", "bbq", "housewarming", "baby shower"],
      holiday: ["holiday", "christmas", "thanksgiving", "easter", "festive", "new year"],
      brunch: ["brunch", "breakfast", "late morning", "bottomless", "lunch"],
      formal: ["formal", "black tie", "black-tie", "gala", "business dinner", "corporate", "awards", "reception", "elegant", "wedding", "engagement"]
    };
    const form = document.querySelector("#planner-form");
    const guestInput = document.querySelector("#guests");
    const courseButtons = [...document.querySelectorAll(".course-option")];
    const list = document.querySelector("#menu-list");
    const recommendationsView = document.querySelector("#recommendations-view");
    const detailView = document.querySelector("#detail-view");
    const occasionError = document.querySelector("#occasion-error");
    let selectedCourses = 4;
    let currentMenus = [];
    let currentMenu = null;
    let previousMenuNames = [];
    let previousMenuImages = [];
    let previousRequestKey = "";
    const ingredientStorageKey = "tablepop.checkedIngredients";
    const savedShoppingListsStorageKey = "tablepop.savedShoppingLists";
    const checkedIngredients = new Set(loadCheckedIngredients());
    const savedShoppingLists = new Map(loadSavedShoppingLists().map((list) => [list.key, list]));
    let currentShoppingListKey = "";

    function loadCheckedIngredients() {
      try {
        const saved = JSON.parse(localStorage.getItem(ingredientStorageKey) || "[]");
        return Array.isArray(saved) ? saved.filter((key) => typeof key === "string") : [];
      } catch {
        return [];
      }
    }

    function saveCheckedIngredients() {
      try {
        localStorage.setItem(ingredientStorageKey, JSON.stringify([...checkedIngredients]));
      } catch {
        return;
      }
    }

    function loadSavedShoppingLists() {
      try {
        const saved = JSON.parse(localStorage.getItem(savedShoppingListsStorageKey) || "[]");
        return Array.isArray(saved) ? saved.filter((list) => list && typeof list.key === "string" && typeof list.recipeId === "string" && Array.isArray(list.items)) : [];
      } catch {
        return [];
      }
    }

    function saveSavedShoppingLists() {
      try {
        localStorage.setItem(savedShoppingListsStorageKey, JSON.stringify([...savedShoppingLists.values()]));
      } catch {
        return;
      }
    }

    function photoUrl(id, width = 560) {
      return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=82`;
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(value);
    }

    function scaledAmount(quantity, guests) {
      const amount = quantity * guests / 4;
      if (amount === 0) return "to taste";
      const rounded = amount >= 10 ? Math.round(amount / 5) * 5 : amount >= 2 ? Math.round(amount * 2) / 2 : Math.round(amount * 4) / 4;
      return `${Number.isInteger(rounded) ? rounded : rounded.toFixed(2).replace(/0$/, "")}`;
    }

    function menuRecipes(menu, count) {
      return coursePlans[count].map((index) => menu.recipes[index]);
    }

    function ingredientCheckKey(menu, recipeId, guests, name, unit) {
      const ingredientKey = `${name.trim().toLowerCase()}|${unit.trim().toLowerCase()}`;
      return JSON.stringify([menu.name, recipeId, selectedCourses, guests, ingredientKey]);
    }

    function menuCost(menu, count, guests) {
      return menuRecipes(menu, count).reduce((sum, id) => sum + recipes[id].cost, 0) * guests;
    }

    function inferOccasionSignals(occasion) {
      const words = ` ${occasion.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim()} `;
      return Object.entries(occasionKeywords)
        .filter(([, keywords]) => keywords.some((keyword) => words.includes(` ${keyword} `)))
        .map(([signal]) => signal);
    }

    async function findUnknownOccasionWords(occasion) {
      const words = [...new Set((occasion.toLowerCase().match(/[\p{L}]+/gu) || []).filter((word) => word.length > 1))];
      const checks = await Promise.all(words.map(async (word) => {
        try {
          const params = new URLSearchParams({ action: "parse", page: word, prop: "sections", format: "json", origin: "*" });
          const response = await fetch(`https://en.wiktionary.org/w/api.php?${params}`);
          if (!response.ok) return null;
          const result = await response.json();
          const hasEnglishEntry = result.parse?.sections?.some((section) => section.line.toLowerCase() === "english");
          return hasEnglishEntry ? null : word;
        } catch {
          return null;
        }
      }));
      return checks.filter(Boolean);
    }

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function selectVariedMenus(candidates, limit) {
      const target = Math.min(limit, candidates.length);
      const tieBreakers = new Map(candidates.map((menu) => [menu, Math.random()]));
      const dishes = new Map(candidates.map((menu) => [menu, menuRecipes(menu, selectedCourses)]));
      let bestScore = -Infinity;
      let bestMenus = [];

      function choose(startIndex, chosen) {
        if (chosen.length === target) {
          let dishOverlap = 0;
          let imageOverlap = 0;
          chosen.forEach((menu, index) => {
            chosen.slice(index + 1).forEach((other) => {
              dishOverlap += dishes.get(menu).filter((id) => dishes.get(other).includes(id)).length;
              imageOverlap += menu.image === other.image ? 1 : 0;
            });
          });
          const preference = chosen.reduce((score, menu) => {
            const freshness = (previousMenuNames.includes(menu.name) ? 0 : 2) + (previousMenuImages.includes(menu.image) ? 0 : 1);
            return score + menu.occasionFit * 10 + freshness + tieBreakers.get(menu) / 100;
          }, 0);
          const score = -dishOverlap * 1000 - imageOverlap * 20 + preference;
          if (score > bestScore) {
            bestScore = score;
            bestMenus = [...chosen];
          }
          return;
        }

        for (let index = startIndex; index <= candidates.length - (target - chosen.length); index += 1) {
          choose(index + 1, [...chosen, candidates[index]]);
        }
      }

      choose(0, []);
      return bestMenus;
    }

    function renderMenus() {
      const budget = Number(document.querySelector("#budget").value);
      const guests = Number(guestInput.value);
      const occasion = document.querySelector("#occasion").value.trim();
      const cuisine = document.querySelector("#cuisine").value;
      const requestKey = JSON.stringify([budget, guests, selectedCourses, occasion.toLowerCase(), cuisine]);
      if (requestKey !== previousRequestKey) {
        previousMenuNames = [];
        previousMenuImages = [];
        previousRequestKey = requestKey;
      }
      const occasionSignals = inferOccasionSignals(occasion);
      const matching = menus
        .map((menu) => ({
          ...menu,
          occasionFit: occasionSignals.filter((signal) => menu.occasions.includes(signal)).length,
          total: menuCost(menu, selectedCourses, guests)
        }))
        .filter((menu) => occasionSignals.length === 0 || menu.occasionFit > 0)
        .filter((menu) => !cuisine || menu.cuisines?.includes(cuisine))
        .filter((menu) => menu.total <= budget);
      const selected = selectVariedMenus(shuffled(matching), 3);
      currentMenus = selected;
      previousMenuNames = selected.map((menu) => menu.name);
      previousMenuImages = selected.map((menu) => menu.image);
      const occasionNote = occasionSignals.length ? ` for ${occasion}` : ` for your ${occasion}`;
      const cuisineNote = cuisine ? ` · ${cuisine}` : "";
      document.querySelector("#results-subtitle").textContent = `${selectedCourses} ${selectedCourses === 1 ? "course" : "courses"}${occasionNote}${cuisineNote} · ${guests} people · ${formatMoney(budget)} to spend.`;
      document.querySelector("#match-count").textContent = `${selected.length} ${selected.length === 1 ? "good idea" : "good ideas"}`;
      if (!selected.length) {
        list.innerHTML = cuisine
          ? `<div class="empty-state"><div class="empty-mark" aria-hidden="true">↗</div><h3>No ${cuisine} menus yet.</h3><p>Try another cuisine, or choose any cuisine to see all available menus.</p></div>`
          : `<div class="empty-state"><div class="empty-mark" aria-hidden="true">↗</div><h3>Let's stretch that budget.</h3><p>Try adding a little more to the pot, or trim a course or two.</p></div>`;
        return;
      }
      list.innerHTML = selected.map((menu, index) => {
        const dishes = menuRecipes(menu, selectedCourses).map((id) => recipes[id].name);
        const perPerson = menu.total / guests;
        return `<article class="menu-card">
          <div class="menu-photo"><img src="${photoUrl(menu.image)}" alt="A taste of ${menu.name}" loading="lazy"><span class="menu-number">0${index + 1}</span></div>
          <div class="menu-info"><div class="menu-kicker"><span>${menu.mood}</span><span class="fit">Fits the budget ✓</span></div>
            <h3>${menu.name}</h3><div class="dish-list">${dishes.map((dish) => `<span>${dish}</span>`).join("")}</div>
            <div class="menu-bottom"><div class="price">${formatMoney(menu.total)} <small>total · ${formatMoney(perPerson)} / person</small></div><button class="detail-button" type="button" data-menu="${index}">Make this menu ↗</button></div>
          </div>
        </article>`;
      }).join("");
    }

    function renderMenuDishes(menu) {
      currentMenu = menu;
      const chosenRecipes = menuRecipes(menu, selectedCourses);
      detailView.innerHTML = `<div class="detail-top"><button class="back-button" type="button"><span aria-hidden="true">←</span>All menu ideas</button></div>
        <h2 class="detail-title">${menu.name}</h2>
        <div class="dish-grid">${chosenRecipes.map((id) => {
          const recipe = recipes[id];
          return `<button class="dish-choice" type="button" data-recipe="${id}"><img src="${photoUrl(recipe.image, 480)}" alt="" loading="lazy"><span>${recipe.name}</span></button>`;
        }).join("")}</div>`;
      recommendationsView.style.display = "none";
      detailView.style.display = "block";
      detailView.querySelector(".back-button").addEventListener("click", showRecommendations);
      detailView.querySelectorAll("[data-recipe]").forEach((button) => button.addEventListener("click", () => renderRecipe(button.dataset.recipe)));
      window.scrollTo({ top: document.querySelector(".results").getBoundingClientRect().top + window.scrollY - 18, behavior: "smooth" });
    }

    function createSavedShoppingList(recipeId, recipe, items) {
      return {
        key: currentShoppingListKey,
        recipeId,
        recipeName: recipe.name,
        menuName: currentMenu.name,
        courses: selectedCourses,
        guests: Number(guestInput.value),
        savedAt: new Date().toISOString(),
        items: items.map(({ name, amount }) => ({ name, amount }))
      };
    }

    function updateRecipeShoppingList(recipeId, recipe, ingredientItems) {
      const selectedItems = ingredientItems.filter((item) => checkedIngredients.has(item.checkKey));
      const savedList = savedShoppingLists.get(currentShoppingListKey);
      if (savedList) {
        if (selectedItems.length) savedShoppingLists.set(currentShoppingListKey, createSavedShoppingList(recipeId, recipe, selectedItems));
        else savedShoppingLists.delete(currentShoppingListKey);
        saveSavedShoppingLists();
      }
      const saveChoice = detailView.querySelector("#save-recipe-list");
      const listIsSaved = savedShoppingLists.has(currentShoppingListKey);
      saveChoice.checked = listIsSaved;
      saveChoice.disabled = !selectedItems.length && !listIsSaved;
      detailView.querySelector("#recipe-list-status").textContent = listIsSaved
        ? `${selectedItems.length} checked ${selectedItems.length === 1 ? "ingredient" : "ingredients"} saved for this dish.`
        : "Select ingredients in this dish, then save them here.";
      detailView.querySelector("#recipe-grocery-count").textContent = `${selectedItems.length} ${selectedItems.length === 1 ? "item" : "items"}`;
      detailView.querySelector("#recipe-grocery-items").innerHTML = selectedItems.length
        ? selectedItems.map((item) => `<li><span>${item.name}</span><span>${item.amount}</span></li>`).join("")
        : `<li class="shopping-list-empty">No ingredients selected.</li>`;
      detailView.querySelector("#export-recipe-list").disabled = !listIsSaved || !selectedItems.length;
    }

    function exportShoppingList() {
      const savedList = savedShoppingLists.get(currentShoppingListKey);
      if (!savedList || !savedList.items.length) return;
      const PdfDocument = window.jspdf?.jsPDF;
      if (!PdfDocument) {
        detailView.querySelector("#recipe-list-status").textContent = "PDF export is unavailable. Check your internet connection and try again.";
        return;
      }

      const pdf = new PdfDocument();
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 16;
      const cleanText = (value) => String(value).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^\x20-\x7e]/g, "");
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(18);
      pdf.text("Tablepop Shopping List", margin, 20);
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(11);
      pdf.text(cleanText(savedList.recipeName), margin, 29);
      pdf.setFontSize(10);
      pdf.text(cleanText(`${savedList.menuName} | ${savedList.courses} courses | ${savedList.guests} people`), margin, 37);

      let cursorY = 49;
      savedList.items.forEach((item, index) => {
        const lines = pdf.splitTextToSize(`${index + 1}. ${cleanText(item.name)} - ${cleanText(item.amount)}`, pageWidth - margin * 2);
        const rowHeight = lines.length * 6;
        if (cursorY + rowHeight > pageHeight - margin) {
          pdf.addPage();
          cursorY = margin;
        }
        pdf.text(lines, margin, cursorY);
        cursorY += rowHeight + 4;
      });

      const filename = cleanText(savedList.recipeName).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "tablepop";
      pdf.save(`${filename}-shopping-list.pdf`);
    }

    function renderRecipe(recipeId) {
      const recipe = recipes[recipeId];
      const guests = Number(guestInput.value);
      if (!currentMenu || !recipe) return;
      currentShoppingListKey = JSON.stringify([currentMenu.name, recipeId, selectedCourses, guests]);
      const ingredientItems = recipe.ingredients.map(([quantity, unit, name]) => ({
        name,
        unit,
        amount: `${scaledAmount(quantity, guests)} ${unit}`.trim(),
        checkKey: ingredientCheckKey(currentMenu, recipeId, guests, name, unit)
      }));
      detailView.innerHTML = `<div class="detail-top"><button class="back-button" type="button"><span aria-hidden="true">←</span>Menu dishes</button></div>
        <article class="recipe"><div class="recipe-head"><img src="${photoUrl(recipe.image, 720)}" alt="${recipe.name}" loading="lazy"><div class="recipe-title"><span class="course-label">${recipe.course}</span><h3>${recipe.name}</h3><p>${formatMoney(recipe.cost)} per person · ${guests} servings</p></div></div>
          <div class="recipe-content"><section><h4>Ingredients</h4><ul class="ingredients">${ingredientItems.map((item, index) => `<li><label class="recipe-ingredient"><input type="checkbox" data-recipe-ingredient="${index}" aria-label="Select ${item.name} for ${recipe.name} grocery list" ${checkedIngredients.has(item.checkKey) ? "checked" : ""}><span>${item.name}</span><span>${item.amount}</span></label></li>`).join("")}</ul>
            <div class="recipe-grocery-tools"><label class="save-list-choice"><input id="save-recipe-list" type="checkbox" ${savedShoppingLists.has(currentShoppingListKey) ? "checked" : ""}><span>Save checked ingredients from this dish</span></label><p class="saved-list-status" id="recipe-list-status" role="status"></p>
              <div class="recipe-grocery-heading"><h5>Grocery list</h5><span class="shopping-list-count" id="recipe-grocery-count"></span></div><ul class="shopping-list-items" id="recipe-grocery-items" aria-live="polite"></ul><button class="export-list-button" id="export-recipe-list" type="button">Export list</button>
            </div>
          </section>
          <section><h4>Step-by-step</h4><ol class="method">${recipe.method.map((step) => `<li>${step}</li>`).join("")}</ol></section></div></article>`;
      detailView.querySelector(".back-button").addEventListener("click", () => renderMenuDishes(currentMenu));
      detailView.querySelectorAll("[data-recipe-ingredient]").forEach((checkbox) => checkbox.addEventListener("change", () => {
        const item = ingredientItems[Number(checkbox.dataset.recipeIngredient)];
        if (!item) return;
        if (checkbox.checked) checkedIngredients.add(item.checkKey);
        else checkedIngredients.delete(item.checkKey);
        saveCheckedIngredients();
        updateRecipeShoppingList(recipeId, recipe, ingredientItems);
      }));
      detailView.querySelector("#save-recipe-list").addEventListener("change", (event) => {
        if (event.currentTarget.checked) {
          const selectedItems = ingredientItems.filter((item) => checkedIngredients.has(item.checkKey));
          savedShoppingLists.set(currentShoppingListKey, createSavedShoppingList(recipeId, recipe, selectedItems));
        } else {
          savedShoppingLists.delete(currentShoppingListKey);
        }
        saveSavedShoppingLists();
        updateRecipeShoppingList(recipeId, recipe, ingredientItems);
      });
      detailView.querySelector("#export-recipe-list").addEventListener("click", exportShoppingList);
      updateRecipeShoppingList(recipeId, recipe, ingredientItems);
      window.scrollTo({ top: document.querySelector(".results").getBoundingClientRect().top + window.scrollY - 18, behavior: "smooth" });
    }

    function showRecommendations() {
      detailView.style.display = "none";
      recommendationsView.style.display = "block";
      currentMenu = null;
    }

    courseButtons.forEach((button) => button.addEventListener("click", () => {
      selectedCourses = Number(button.dataset.courses);
      courseButtons.forEach((option) => option.setAttribute("aria-pressed", String(option === button)));
    }));

    document.querySelectorAll(".stepper").forEach((button) => button.addEventListener("click", () => {
      const next = Number(guestInput.value) + Number(button.dataset.step);
      guestInput.value = Math.max(1, Math.min(20, next));
    }));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      occasionError.hidden = true;
      occasionError.textContent = "";
      const unknownWords = await findUnknownOccasionWords(document.querySelector("#occasion").value.trim());
      if (unknownWords.length) {
        occasionError.textContent = `We couldn't recognize ${unknownWords.map((word) => `“${word}”`).join(", ")}. Please rewrite the occasion using English words.`;
        occasionError.hidden = false;
        return;
      }
      showRecommendations();
      renderMenus();
      document.querySelector("#recommendations-view").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    list.addEventListener("click", (event) => {
      const button = event.target.closest("[data-menu]");
      if (button) renderMenuDishes(currentMenus[Number(button.dataset.menu)]);
    });

    renderMenus();
    const splashScreen = document.querySelector("#splash-screen");
    const appContent = document.querySelector("#app-content");
    window.setTimeout(() => {
      splashScreen.classList.add("is-leaving");
      window.setTimeout(() => {
        splashScreen.remove();
        appContent.removeAttribute("inert");
      }, 250);
    }, 1750);
  </script>
</body>
</html>
